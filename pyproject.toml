[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vestidor"
version = "0.1.0"
description = "Asistente de outfits old money / casual arreglado pensado para agentes de IA: armario local, clima y collage del look."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pillow>=10.1"]

[project.optional-dependencies]
bg = ["rembg[cpu]>=2.0.50"]
dev = ["pytest>=8"]

[project.scripts]
vestidor = "vestidor.cli:main"

[tool.setuptools]
packages = ["vestidor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
